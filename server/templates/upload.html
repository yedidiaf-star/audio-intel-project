<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>העלאת הקלטה</title>
</head>
<body>
    <h1>העלאת הקלטה</h1>
    <form id="upload-form">
        <input type="file" id="audio-file" name="audio_file" accept=".wav,.mp3" required>
        <button type="submit">העלה</button>
    </form>
    <p id="result"></p>

    <script>
        document.getElementById("upload-form").addEventListener("submit", async function (e) {
            e.preventDefault();
            const fileInput = document.getElementById("audio-file");
            const formData = new FormData();
            formData.append("audio_file", fileInput.files[0]);

            const response = await fetch("/upload", {
                method: "POST",
                body: formData
            });
            const data = await response.json();

            const resultEl = document.getElementById("result");
            if (data.success) {
                resultEl.textContent = "הקובץ הועלה בהצלחה: " + data.file_id;
            } else {
                resultEl.textContent = "שגיאה: " + data.error;
            }
        });
    </script>
</body>
</html>
